<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Site — Chat Assistant Demo</title>
  <link rel="stylesheet" href="widget.css" />
</head>
<body>
  <h1>Your Website</h1>
  <p>This page simulates your existing site. The chat widget below embeds
     the same way it would on your real site — via the script tag at the
     bottom of this file.</p>

  <!-- Embed target -->
  <div id="rag-chat-widget"></div>

  <script>
    window.RAG_CHAT_CONFIG = {
      apiBase: "http://localhost:8000",
      category: null,
      debug: true            // dev only: logs retrieved chunks in the browser console
      // turnstileSiteKey: "0x4AAAA..."  // optional: Cloudflare Turnstile PUBLIC site key
    };
  </script>
  <script src="widget.js"></script>
</body>
</html>
